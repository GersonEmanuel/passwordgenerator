<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="hero">
            <h2 class="title">Password generator</h2>
            <p class="subtitle">generate strong passwords</p>
        </section>
        
        <section class="box">

            <div class="password">

                <div class="text">
                    <input type="text" name="password" id="password">
                </div>

                <div class="actions">
                    <button id="copy">Copy</button>
                    <button id="new_password">Regenerate</button>
                </div>
           
            </div>

            <div class="security-indicator">
                <div id="security-indicator-bar" class="bar" style="width: 90%;"></div>
            </div>

        </section>

        <section class="box customize">
            <h3 class="title">edit</h3>
            <div class="actions">
                
                <div class="password-length">
                    <p>Size: <span id="password-length-text">16</span></p>

                    <input type="range" name="password-length" id="password-length" class="slider" value="16" min="4" max="64">
                </div>

                <div class="config">
                    <label class="checkbox-container">
                        <span class="text">Uppercase</span>
                        <input type="checkbox" id="uppercase-check" checked>
                        <span class="checkmark"></span>
                    </label>

                    <label class="checkbox-container">
                        <span class="text">Special characters</span>
                        <input type="checkbox" id="specialcharacters-check" checked>
                        <span class="checkmark"></span>
                    </label>

                    <label class="checkbox-container">
                        <span class="text">Numbers</span>
                        <input type="checkbox" id="numbers-check" checked>
                        <span class="checkmark"></span>
                    </label>

                </div>

            </div>
        </section>
        
    
        
        

    </main>


    <script src="scripts.js"></script>

   
</body>
</html>
