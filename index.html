<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador</title>
</head>
<body>
    <h2>Password generator</h2>
    <p>generate strong password</p>
    <input type="text" name="password" id="password">

    <input type="range" name="password-length" id="password-length" value="16" min="4" max="64">

    <button id="copy">copiar senha</button>

    <script>
        let passwordleng = 16;
        const inputpasswordEl = document.querySelector("#password")
        

        function generatepassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,-./:;<=>?@[]^_{|}~"

            let password = ""

            for(let i = 0; i<passwordleng; i++){
                const randomnumber = Math.floor(Math.random()*chars.length)
                password += chars.substring(randomnumber, randomnumber + 1)

            }
            inputpasswordEl.value = password
        }

        function copy() {
            navigator.clipboard.writeText(inputpasswordEl.value)
        }

        const passwordlengthEL = document.querySelector("#password-length")
        passwordlengthEL.addEventListener("input", function(){
            const passwordleng = passwordlengthEL.value
            generatepassword()
        })

        const copybuttonEl = document.querySelector("#copy")
        copybuttonEl.addEventListener("click", copy)

        generatepassword()
    </script>
</body>
</html>
